<app-header></app-header>
<app-sidebar></app-sidebar>

<div class="dashboard-header">
  <h2 class="dashboard-title">Employee Resignation</h2>
  <nav class="breadcrumb">
    <a href="#">Home</a> &gt;
    <a href="#">Employee Profile</a> &gt;
    <span>Employee Resignation</span>
  </nav>
</div>

<div class="tab-container">
  <div class="content">
    <form>

      <!-- Row 1 -->
      <div class="row mb-3">

        <!-- Resignation Type -->
        <div class="col-md-4">
          <label class="form-label">Resignation Type</label>
          <select class="form-select"
        [(ngModel)]="selectedResignationTypeId"
        (ngModelChange)="onResignationTypeChange()"
        name="resignationType"
        required>

  <option [ngValue]="null">Select resignation type</option>

  <option *ngFor="let type of resignationTypes"
          [ngValue]="type.resignationTypeId">
    {{ type.resignationTypeName }}
  </option>
</select>

        </div>

        <!-- Notice Period -->
        <div class="col-md-4">
          <label class="form-label">Notice Period (Days)</label>
          <input type="text"
                 class="form-control"
                 [value]="noticePeriod"
                 readonly>
        </div>

        <!-- Last Working Day -->
        <div class="col-md-4">
          <label class="form-label">Last Working Day</label>
          <input type="date"
       class="form-control"
       [value]="calculateLastWorkingDay()"
       readonly>

        </div>

      </div>

      <!-- Row 2 -->
      <div class="row mb-3">
        <div class="col-md-12">
          <label class="form-label">Resignation Reason</label>
          <textarea class="form-control"
          placeholder="Provide reason for resignation"
          name="reason"
          [(ngModel)]="reason"
          required>
</textarea>

        </div>
      </div>

      <!-- Submit -->
      <div class="row">
        <div class="col-md-12 text-first">
          <button type="button"
                  class="btn btn-primary"
                  (click)="submitResignation()">
            Submit Resignation
          </button>

        </div>
      </div>

    </form>

    <!-- Resignation Table -->
    <div class="dashboard-tables full-row mt-4">
      <div class="table-card">
        <h3>Resignation / Exit List</h3>
        <table class="table table-bordered">
          <thead>
            <tr>
              <th>Employee</th>
              <th>Type</th>
              <th>Notice Period</th>
              <th>Last Working Day</th>
              <th>Reason</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Future dynamic rows -->
            <tr *ngFor="let r of resignations">
              <td>{{ r.employeeId }}</td>
              <td>{{ r.resignationType }}</td>
              <td>{{ r.noticePeriod }}</td>
              <td>{{ r.lastWorkingDay | date:'yyyy-MM-dd'  }}</td>
              <td>{{ r.resignationReason }}</td>
            </tr>

          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<app-footer></app-footer>
