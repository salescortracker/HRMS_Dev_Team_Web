<div class="card shadow-sm country-master">
  <div class="container-fluid p-4">

    <h4 class="mb-4">
      <i class="fa-solid fa-globe me-2"></i>
      Country Management
    </h4>

    <!-- FORM -->
    <form (ngSubmit)="saveCountry()" #countryForm="ngForm" class="mb-4">
      <div class="row g-3 align-items-end">

        <!-- Country Name -->
        <div class="col-md-4">
          <label class="form-label">Country Name</label>
          <input type="text"
                 class="form-control"
                 name="countryName"
                 [(ngModel)]="country.countryName"
                 required>
        </div>

        <!-- Company -->
        <div class="col-md-4">
          <label class="form-label">Company</label>
          <select class="form-select"
                  name="companyId"
                  [(ngModel)]="country.companyId"
                  required>
            <option value="">Select Company</option>
            <option *ngFor="let c of companyDropdown"
                    [value]="c.companyId">
              {{ c.companyName }}
            </option>
          </select>
        </div>

        <!-- Region -->
        <div class="col-md-4">
          <label class="form-label">Region</label>
          <select class="form-select"
                  name="regionId"
                  [(ngModel)]="country.regionId"
                  required>
            <option value="">Select Region</option>
            <option *ngFor="let r of regionDropdown"
                    [value]="r.regionID">
              {{ r.regionName }}
            </option>
          </select>
        </div>

        <!-- Status -->
        <div class="col-md-4 mt-2">
          <div class="form-check form-switch">
            <input class="form-check-input"
                   type="checkbox"
                   name="isActive"
                   [(ngModel)]="country.isActive">
            <label class="form-check-label">
              {{ country.isActive ? 'Active' : 'Inactive' }}
            </label>
          </div>
        </div>

        <!-- Button -->
        <div class="col-md-8 mt-2 text-end">
          <button class="btn btn-dark px-4" [disabled]="!countryForm.valid">
            {{ isEditMode ? 'Update Country' : 'Save Country' }}
          </button>
        </div>

      </div>
    </form>

    <!-- FILTERS -->
    <div class="row g-3 mb-3">
      <div class="col-md-4">
        <input class="form-control"
               placeholder="Search Country"
               [(ngModel)]="searchText">
      </div>

      <div class="col-md-4">
        <select class="form-select" [(ngModel)]="statusFilter">
          <option value="">All</option>
          <option [ngValue]="true">Active</option>
          <option [ngValue]="false">Inactive</option>
        </select>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead>
          <tr>
            <th>#</th>
            <th (click)="sortTable('countryName')" style="cursor:pointer">
              Country
              <i class="fa" [ngClass]="getSortIcon('countryName')"></i>
            </th>
            <th>Status</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let c of pagedCountries; let i = index">
            <td>{{ (currentPage - 1) * pageSize + i + 1 }}</td>
            <td>{{ c.countryName }}</td>
            <td>
              <span class="badge"
                    [ngClass]="c.isActive ? 'bg-success' : 'bg-secondary'">
                {{ c.isActive ? 'Active' : 'Inactive' }}
              </span>
            </td>
            <td class="text-center">
              <button class="btn btn-sm btn-outline-primary me-2"
                      (click)="editCountry(c)">
                Edit
              </button>
              <button class="btn btn-sm btn-outline-danger"
                      (click)="deleteCountry(c)">
                Delete
              </button>
            </td>
          </tr>

          <tr *ngIf="pagedCountries.length === 0">
            <td colspan="4" class="text-center text-muted">
              No records found
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- PAGINATION -->
    <nav *ngIf="totalPages > 1" class="d-flex justify-content-end mt-3">
      <ul class="pagination pagination-sm">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <a class="page-link" (click)="goToPage(currentPage - 1)">Previous</a>
        </li>

        <li class="page-item"
            *ngFor="let _ of [].constructor(totalPages); let i = index"
            [class.active]="currentPage === i + 1">
          <a class="page-link" (click)="goToPage(i + 1)">
            {{ i + 1 }}
          </a>
        </li>

        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <a class="page-link" (click)="goToPage(currentPage + 1)">Next</a>
        </li>
      </ul>
    </nav>

  </div>
</div>
