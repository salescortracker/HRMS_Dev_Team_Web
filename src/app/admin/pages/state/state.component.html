<div class="card shadow-sm state-master">
  <div class="container-fluid p-4">

    <h4 class="mb-4">
      <i class="fa-solid fa-map me-2"></i>
      State Management
    </h4>

    <!-- FORM -->
    <form (ngSubmit)="saveState()" #stateForm="ngForm" class="mb-4">
      <div class="row g-3 align-items-end">

        <!-- Country -->
        <div class="col-md-4">
          <label class="form-label">Country</label>
          <select class="form-select"
                  name="countryId"
                  [(ngModel)]="state.countryId"
                  required>
            <option value="">Select Country</option>
            <option *ngFor="let c of countries" [value]="c.countryId">
              {{ c.countryName }}
            </option>
          </select>
        </div>

        <!-- State Name -->
        <div class="col-md-4">
          <label class="form-label">State Name</label>
          <input type="text"
                 class="form-control"
                 name="stateName"
                 [(ngModel)]="state.stateName"
                 required>
        </div>

        <!-- Company -->
        <div class="col-md-4">
          <label class="form-label">Company</label>
          <select class="form-select"
                  name="companyId"
                  [(ngModel)]="state.companyId"
                  required>
            <option value="">Select Company</option>
            <option *ngFor="let c of companyDropdown" [value]="c.companyId">
              {{ c.companyName }}
            </option>
          </select>
        </div>

        <!-- Region -->
        <div class="col-md-4">
          <label class="form-label">Region</label>
          <select class="form-select"
                  name="regionId"
                  [(ngModel)]="state.regionId"
                  required>
            <option value="">Select Region</option>
            <option *ngFor="let r of regionDropdown" [value]="r.regionID">
              {{ r.regionName }}
            </option>
          </select>
        </div>

        <!-- Status -->
        <div class="col-md-4 mt-2">
          <div class="form-check form-switch">
            <input class="form-check-input"
                   type="checkbox"
                   name="isActive"
                   [(ngModel)]="state.isActive">
            <label class="form-check-label">
              {{ state.isActive ? 'Active' : 'Inactive' }}
            </label>
          </div>
        </div>

        <!-- Button -->
        <div class="col-md-8 mt-2 text-end">
          <button class="btn btn-dark px-4" [disabled]="!stateForm.valid">
            {{ isEditMode ? 'Update State' : 'Save State' }}
          </button>
        </div>

      </div>
    </form>

    <!-- FILTERS -->
    <div class="row g-3 mb-3">
      <div class="col-md-4">
        <input class="form-control"
               placeholder="Search State"
               [(ngModel)]="searchText">
      </div>

      <div class="col-md-4">
        <select class="form-select" [(ngModel)]="statusFilter">
          <option value="">All</option>
          <option [ngValue]="true">Active</option>
          <option [ngValue]="false">Inactive</option>
        </select>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead>
          <tr>
            <th>#</th>
            <th (click)="sortTable('stateName')" style="cursor:pointer">
              State <i class="fa" [ngClass]="getSortIcon('stateName')"></i>
            </th>
            <th>Country</th>
            <th>Status</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let s of pagedStates; let i = index">
            <td>{{ (currentPage - 1) * pageSize + i + 1 }}</td>
            <td>{{ s.stateName }}</td>
            <td>{{ s.countryName }}</td>
            <td>
              <span class="badge" [ngClass]="s.isActive ? 'bg-success' : 'bg-secondary'">
                {{ s.isActive ? 'Active' : 'Inactive' }}
              </span>
            </td>
            <td class="text-center">
              <button class="btn btn-sm btn-outline-primary me-2" (click)="editState(s)">Edit</button>
              <button class="btn btn-sm btn-outline-danger" (click)="deleteState(s)">Delete</button>
            </td>
          </tr>

          <tr *ngIf="pagedStates.length === 0">
            <td colspan="5" class="text-center text-muted">No records found</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- PAGINATION -->
    <nav *ngIf="totalPages > 1" class="d-flex justify-content-end mt-3">
      <ul class="pagination pagination-sm">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <a class="page-link" (click)="goToPage(currentPage - 1)">Previous</a>
        </li>

        <li class="page-item" *ngFor="let _ of [].constructor(totalPages); let i = index" [class.active]="currentPage === i + 1">
          <a class="page-link" (click)="goToPage(i + 1)">{{ i + 1 }}</a>
        </li>

        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <a class="page-link" (click)="goToPage(currentPage + 1)">Next</a>
        </li>
      </ul>
    </nav>

  </div>
</div>
