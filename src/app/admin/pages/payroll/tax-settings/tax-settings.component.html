<div class="card shadow-sm">
  <div class="container-fluid p-4 tax-settings">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-semibold">Tax Settings</h4>
    </div>

    <!-- Form Section -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <form [formGroup]="taxForm" (ngSubmit)="saveTax()" novalidate>
          <div class="row g-3">

            <div class="col-md-3">
              <label class="form-label">Tax Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control"
                     formControlName="TaxName" placeholder="Income Tax">
            </div>

            <div class="col-md-3">
              <label class="form-label">Type <span class="text-danger">*</span></label>
              <select class="form-select" formControlName="TaxTypeId">
                <option value="">Select Type</option>
                <option *ngFor="let t of taxTypes" [value]="t.taxTypeId">
                  {{ t.taxTypeName }}
                </option>
              </select>
            </div>

            <div class="col-md-2">
              <label class="form-label">Rate (%) <span class="text-danger">*</span></label>
              <input type="number" class="form-control"
                     formControlName="Rate" placeholder="0.00">
            </div>

            <div class="col-md-2">
              <label class="form-label">Effective Date</label>
              <input type="date" class="form-control"
                     formControlName="EffectiveDate">
            </div>

            <div class="col-md-2 d-flex align-items-center mt-4">
              <label class="form-check-label me-2 fw-semibold">Is Active</label>
              <div class="form-check form-switch">
                <input class="form-check-input"
                       type="checkbox"
                       formControlName="IsActive">
              </div>
            </div>

          </div>

          <div class="mt-4 text-end">
            <button class="btn btn-success me-2"
                    type="submit"
                    [disabled]="taxForm.invalid">
              <i class="fa-solid fa-save me-2"></i>
              {{ editingTaxId ? 'Update' : 'Save' }}
            </button>

            <button class="btn btn-secondary"
                    type="button"
                    (click)="resetForm()">
              <i class="fa-solid fa-rotate-left me-2"></i>
              Reset
            </button>
          </div>

        </form>
      </div>
    </div>

    <!-- Table Section -->
    <div class="card shadow-sm">
      <div class="card-body">

        <!-- Search -->
        <div class="mb-3 d-flex justify-content-end">
          <input type="text"
                 class="form-control w-25"
                 placeholder="Search Tax Name"
                 [(ngModel)]="searchText">
        </div>

        <!-- Table -->
        <table class="table table-hover table-bordered align-middle">
          <thead class="table-light">
            <tr>
              <th style="width:80px">S.No</th>

              <!-- SORTABLE HEADERS -->
              <th (click)="sort('TaxName')" style="cursor:pointer">
                Tax Name
                <i class="fa fa-sort ms-1"></i>
              </th>

              <th (click)="sort('TaxTypeId')" style="cursor:pointer">
                Type
                <i class="fa fa-sort ms-1"></i>
              </th>

              <th (click)="sort('Rate')" style="cursor:pointer">
                Rate (%)
                <i class="fa fa-sort ms-1"></i>
              </th>

              <th (click)="sort('EffectiveDate')" style="cursor:pointer">
                Effective Date
                <i class="fa fa-sort ms-1"></i>
              </th>

              <th class="text-center">Active</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let t of paginatedTaxes(); let i = index">
              <td>{{ (currentPage - 1) * pageSize + i + 1 }}</td>
              <td>{{ t.TaxName }}</td>
              <td>{{ getTaxTypeName(t.TaxTypeId) }}</td>
              <td>{{ t.Rate }}</td>
              <td>{{ t.EffectiveDate | date:'shortDate' }}</td>
              <td class="text-center">
                <i [ngClass]="t.IsActive
                  ? 'fa-solid fa-circle-check text-success'
                  : 'fa-solid fa-circle-xmark text-danger'">
                </i>
              </td>
              <td class="text-center">
                <button class="btn btn-sm btn-outline-primary me-2"
                        (click)="editTax(t)">
                  <i class="fa-solid fa-pen-to-square"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger"
                        (click)="deleteTax(t)">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </td>
            </tr>

            <tr *ngIf="filteredTaxes().length === 0">
              <td colspan="7" class="text-center text-muted">
                No tax records found
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Pagination -->
        <nav *ngIf="totalPages() > 1" class="mt-3">
          <ul class="pagination justify-content-center">

            <li class="page-item" [class.disabled]="currentPage === 1">
              <a class="page-link" (click)="changePage(currentPage - 1)">Previous</a>
            </li>

            <li class="page-item"
                *ngFor="let p of pagesArray()"
                [class.active]="currentPage === p">
              <a class="page-link" (click)="changePage(p)">{{ p }}</a>
            </li>

            <li class="page-item"
                [class.disabled]="currentPage === totalPages()">
              <a class="page-link" (click)="changePage(currentPage + 1)">Next</a>
            </li>

          </ul>
        </nav>

      </div>
    </div>

  </div>
</div>
